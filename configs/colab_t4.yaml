project:
  name: "bodhan-bhili-mt"
  task: "machine_translation"
  direction: "bhili_to_marathi"
  seed: 42

run:
  run_id: "bhili_marathi_t4_v1"
  description: "Primary unidirectional Bhili to Marathi QLoRA experiment."

paths:
  artifact_root: "/content/drive/MyDrive/BodhanAI/artifacts"
  hf_cache_dir: ".cache/huggingface"
  raw_data_file: null

dataset:
  source_column: "Dehwali_Bhili"
  target_column: "marathi"
  group_column: "id"
  record_column: "dp_id"
  delimiter: "\t"
  encoding: "utf-8"
  train_ratio: 0.80
  dev_ratio: 0.10
  test_ratio: 0.10
  min_text_chars: 2
  min_source_devanagari_ratio: 0.50
  min_length_ratio: 0.25
  max_length_ratio: 2.00
  remove_exact_duplicates: true

model:
  repo_id: "bodhan-ai/indic-translate"
  target_language: "Marathi"
  max_train_tokens: 256
  max_new_tokens: 512
  attention_implementation: "sdpa"

quantization:
  enabled: true
  load_in_4bit: true
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "auto"

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  target_strategy: "all_linear_filtered"
  exclude_name_fragments:
    - "vision"
    - "visual"
    - "image"
    - "audio"
    - "lm_head"
    - "embed_tokens"

training:
  max_steps: 1400
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  gradient_checkpointing: true
  optimizer: "paged_adamw_8bit"
  logging_steps: 5
  evaluation_steps: 50
  eval_examples: 200
  save_steps: 25
  save_total_limit: 2

evaluation:
  primary_metric: "chrfpp"
  compute_bleu: true
  compute_copy_metrics: true
  bootstrap_samples: 1000
  dev_generation_samples: 100
  test_generation_samples: 300

preflight:
  minimum_python: "3.10"
  minimum_torch: "2.6"
  minimum_transformers: "5.12"
  minimum_vram_gib: 14.0
  minimum_disk_free_gib: 25.0
  require_cuda: true
  check_bodhan_access: true
  check_bitsandbytes_nf4: true
