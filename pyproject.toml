[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-bhili-mt"
version = "0.1.0"
description = "QLoRA fine-tuning pipeline for Dehwali Bhili to Marathi translation using Bodhan Indic-Translate."
readme = "README.md"

requires-python = ">=3.10"

authors = [
    { name = "Dhwani" }
]

dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2",
    "packaging>=24.2",
    "huggingface-hub>=0.30",
    "pandas>=2.2",
]

[project.optional-dependencies]

train = [
    "torch>=2.6",
    "transformers>=5.12,<6",
    "peft>=0.20",
    "accelerate>=1.10",
    "bitsandbytes>=0.46",
    "datasets>=3.0",
    "sacrebleu>=2.5",
    "safetensors>=0.5",
    "numpy>=2.0",
    "tensorboard>=2.18",
    "tqdm>=4.67",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
